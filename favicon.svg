<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Warm parchment background -->
  <rect width="32" height="32" rx="7" fill="#f5f0e6"/>
  <!-- Trunk -->
  <line x1="16" y1="29" x2="16" y2="15" stroke="#2d7050" stroke-width="3" stroke-linecap="round"/>
  <!-- Left branch -->
  <line x1="16" y1="15" x2="7"  y2="7"  stroke="#2d7050" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Right branch -->
  <line x1="16" y1="15" x2="25" y2="7"  stroke="#2d7050" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left endpoint -->
  <circle cx="7"  cy="6"  r="3" fill="#2d7050"/>
  <!-- Right endpoint -->
  <circle cx="25" cy="6"  r="3" fill="#2d7050"/>
</svg>
